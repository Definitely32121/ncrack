<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Базовый кликер</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .game {
      text-align: center;
      padding: 2rem;
      border-radius: 12px;
      background: #1f2937;
      width: min(90vw, 420px);
    }
    .score {
      font-size: 2.2rem;
      margin: 0.7rem 0 1.3rem;
    }
    button {
      font-size: 1.1rem;
      padding: 0.9rem 1.4rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #10b981;
      color: #052e16;
      font-weight: 700;
    }
    button:active {
      transform: scale(0.98);
    }
    .meta {
      margin-top: 1rem;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>Базовый кликер</h1>
    <p>Нажимай кнопку и набирай очки.</p>
    <div class="score" id="score">0</div>
    <button id="click-btn" type="button">+1 клик</button>
    <div class="meta">Рекорд: <span id="best">0</span></div>
  </main>

  <script>
    const scoreNode = document.getElementById('score');
    const bestNode = document.getElementById('best');
    const button = document.getElementById('click-btn');

    let score = 0;
    let best = Number(localStorage.getItem('basic-clicker-best') || 0);
    bestNode.textContent = best;

    button.addEventListener('click', () => {
      score += 1;
      scoreNode.textContent = score;

      if (score > best) {
        best = score;
        bestNode.textContent = best;
        localStorage.setItem('basic-clicker-best', String(best));
      }
    });
  </script>
</body>
</html>
